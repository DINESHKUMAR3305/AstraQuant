services:
  postgres:
    image: postgres:17
    container_name: astraquant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: astraquant
      POSTGRES_USER: astraquant
      POSTGRES_PASSWORD: astraquant_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
